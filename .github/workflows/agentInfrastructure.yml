name: Agent infrastructure

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - AGENTS.md
      - 'agentDocs/**'
      - 'agentTools/**'
      - 'agentTests/**'
      - '.github/workflows/agentInfrastructure.yml'
      - '.github/workflows/autofix.yml'
      - '.github/workflows/cleanupArtifacts.yml'
      - '.github/workflows/contextSnapshot.yml'
      - '.github/workflows/testAndPublish.yml'
      - .gitignore
  pull_request:
    paths:
      - AGENTS.md
      - 'agentDocs/**'
      - 'agentTools/**'
      - 'agentTests/**'
      - '.github/workflows/agentInfrastructure.yml'
      - '.github/workflows/autofix.yml'
      - '.github/workflows/cleanupArtifacts.yml'
      - '.github/workflows/contextSnapshot.yml'
      - '.github/workflows/testAndPublish.yml'
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agentTools:
    name: Agent tools
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'agent/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        submodules: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13.13'
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
      with:
        activate-environment: "false"
    - name: Install test dependency
      run: python -m pip install --disable-pip-version-check pytest
    - name: Validate agent workflows
      shell: bash
      run: |
        set -euo pipefail
        workflowFiles=()
        for file in \
          .github/workflows/agentInfrastructure.yml \
          .github/workflows/autofix.yml \
          .github/workflows/cleanupArtifacts.yml \
          .github/workflows/contextSnapshot.yml \
          .github/workflows/testAndPublish.yml; do
          if [[ -f "$file" ]]; then
            workflowFiles+=("$file")
          fi
        done
        uvx prek run actionlint --files "${workflowFiles[@]}"
    - name: Compile agent tools
      run: python -m compileall -q agentTools
    - name: Run agent tool tests
      run: python -m pytest -q agentTests/test_prepareConnectorPublish.py
